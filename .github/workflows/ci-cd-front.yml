name: CI/CD Angular Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Test (CI) and generate coverage
        run: npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-front
          path: |
            coverage/**
          if-no-files-found: warn

      - name: SonarQube Scan - Frontend
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=aflouat_YourDigiCurateFrontend
            -Dsonar.organization=aflouat
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,dist/**
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/**/lcov.info

      - name: Build Docker image
        run: docker build -t app:latest -f Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker tag app:latest ${{ secrets.DOCKERHUB_USERNAME }}/your-digi-curate-frontend:${{ github.sha }}
          docker tag app:latest ${{ secrets.DOCKERHUB_USERNAME }}/your-digi-curate-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-digi-curate-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-digi-curate-frontend:latest

