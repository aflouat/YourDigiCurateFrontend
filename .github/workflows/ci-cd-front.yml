name: CI/CD Angular Frontend v0.9

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & build Angular
        run: |
            npm install
            npm run build
            npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-front
          path: |
            coverage/**
          if-no-files-found: warn

      - name: SonarQube Scan - Frontend
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=aflouat_YourDigiCurateFrontend
            -Dsonar.organization=aflouat
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,dist/**
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/**/lcov.info

      - name: Build Docker image
        run: |
          # Capture les informations dynamiquement
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(echo $GITHUB_SHA | head -c 7)
          
          docker build . \
           --build-arg API_URL=${{ secrets.API_URL }} \
           --build-arg API_KEY=${{ secrets.API_KEY }} \
           --tag your-digi-curate-frontend:latest \
           -f Dockerfile . \
           --build-arg BUILD_DATE=$BUILD_DATE \
           --build-arg LAST_COMMIT=$COMMIT_SHA 

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker tag app:latest $DOCKERHUB_USERNAME/your-digi-curate-frontend:${{ github.sha }}
          docker tag app:latest $DOCKERHUB_USERNAME/your-digi-curate-frontend:latest
          docker push $DOCKERHUB_USERNAME/your-digi-curate-frontend:${{ github.sha }}
          docker push $DOCKERHUB_USERNAME/your-digi-curate-frontend:latest

